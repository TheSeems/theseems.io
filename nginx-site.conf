# The site's nginx (replaces nginx-unprivileged's default.conf). Cloudflare sits in front and keeps
# whatever these Cache-Control headers allow, so they decide how often a visit goes all the way here.

# Agents can ask for the page as Markdown (Accept: text/markdown). Browsers never do.
map $http_accept $page {
    default         /index.html;
    ~*text/markdown /index.md;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # Cloudflare compresses for browsers anyway; this only makes cache misses lighter on the way to it
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown;

    # Every build gives these files new names (Vite hashes the content into them) and the page links
    # the new names, so a deploy shows up on the next visit. A name never gets new content, so
    # browsers and Cloudflare can keep each file for a year. Without this Cloudflare kept them for
    # 4 hours and then went back to the origin on almost every visit.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page answers with the HTML or the Markdown (see the map above), so both carry Vary: Accept
    location = / {
        rewrite ^ $page last;
    }

    # The page names this build's assets, so browsers check it on every visit. Without a header they
    # guessed a lifetime from Last-Modified and could keep a page for hours after a deploy.
    # Cloudflare keeps it for a day instead, so far-away visitors don't wait on this server. CI clears
    # it by its tag right after each deploy. Cloudflare strips both of these headers from what
    # browsers get, and caches the page at all only because of the cache rule for theseems.io/.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cloudflare-CDN-Cache-Control "max-age=86400";
        add_header Cache-Tag "page";
        add_header Vary "Accept";
    }

    # The page as Markdown, built from the same content (src/markdown.js). Cloudflare must never keep
    # it: its cache key for / ignores Accept, so a stored copy would go out to browsers. The cache
    # rule skips requests that ask for Markdown; no-store is the backstop if that ever changes.
    location = /index.md {
        types { text/markdown md; }
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        add_header Vary "Accept";
    }

    # CI polls it to see which commit is live
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Favicons and the og:image keep their names when they change, so not for long
    location / {
        add_header Cache-Control "public, max-age=3600";
    }
}
