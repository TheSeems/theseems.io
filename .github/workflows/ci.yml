name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  # main only: publishes ghcr.io/theseems/theseems.io:main-<sha>-<unix time>; Flux picks up
  # the newest tag and rolls it out.
  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=main-${GITHUB_SHA::7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/theseems/theseems.io:${{ steps.tag.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/TheSeems/theseems.io
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Green once theseems.io actually serves this commit (Flux rollout + Cloudflare).
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://theseems.io
    timeout-minutes: 15
    steps:
      - name: Wait for theseems.io to serve this commit
        run: |
          for i in $(seq 1 85); do
            live=$(curl -fsS "https://theseems.io/version.json?t=$(date +%s)" | jq -r .sha 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "theseems.io is serving $GITHUB_SHA"; exit 0; fi
            echo "live: ${live:-unknown}, waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "::error::theseems.io did not start serving $GITHUB_SHA within the timeout"
          exit 1
