    <!-- Apply the theme before first paint so dark-mode visitors never see a light flash.
         Mirrors readStored/systemTheme in src/lib/theme.svelte.js, which takes over after load. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theseems-theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>

         Also what non-rendering crawlers and sourcing tools read. Mirrors src/page/Home.svelte.
         Sits before #app, whose min-height would otherwise push it below the fold. -->
    <noscript>
